<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vStrike — Action-RPG Pong Engine</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0A0D14;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      canvas.emscripten {
        display: block;
        max-height: 88vh;
        max-width: 96vw;
        height: auto;
        width: auto;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(188, 140, 255, 0.08);
        outline: none;
      }
      .footer-hint {
        margin-top: 10px;
        color: #8B949E;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      .footer-hint kbd {
        background: #161B22;
        border: 1px solid #30363D;
        border-radius: 4px;
        padding: 2px 7px;
        color: #C9D1D9;
        font-family: inherit;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      <div class="footer-hint">
        Click game canvas to focus &bull; <kbd>W</kbd>/<kbd>S</kbd> &bull; <kbd>&uarr;</kbd>/<kbd>&darr;</kbd> &bull; <kbd>SPACE</kbd> Pause
      </div>
    </div>
    <script type="text/javascript">
      var Module = {
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          return canvas;
        })()
      };
    </script>
    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
